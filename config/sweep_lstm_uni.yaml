program: train.py
project: nlp-art-project-1
name: uni-lstm-hyperparameter-search

method: grid

metric:
  name: best_valid_accuracy
  goal: maximize

parameters:
  model:
    value: lstm

  learning_rate:
    values: [1e-5, 1e-4, 1e-3]

  dropout:
    values: [0.2, 0.3, 0.5]

  classifier_hidden_dim:
    values: [128, 256, 512]

  hidden_dim:
    values: [128, 256]

  patience:
    value: 5

  batch_size:
    value: 64

  num_epochs:
    value: 50

  bidirectional:
    value: false