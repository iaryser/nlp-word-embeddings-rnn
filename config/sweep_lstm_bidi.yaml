program: train.py
name: lstm-hyperparameter-search

method: bayes

metric:
  name: best_valid_accuracy
  goal: maximize

parameters:
  model:
    value: lstm

  learning_rate:
    values: [0.0001, 0.0003, 0.001]

  dropout:
    values: [0.2, 0.3, 0.5]

  classifier_hidden_dim:
    values: [128, 256, 512]

  hidden_dim:
    values: [128, 256]

  patience:
    value: 5

  batch_size:
    value: 64

  num_epochs:
    value: 30

  bidirectional:
    value: true