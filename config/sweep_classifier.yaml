program: src/train.py
project: nlp-art-project-1
name: classifier-hyperparameter-search

method: grid

metric:
  name: best_valid_accuracy
  goal: maximize

parameters:
  model:
    value: classifier

  learning_rate:
    values: [1e-5, 1e-4, 1e-3]

  dropout:
    values: [0.2, 0.3, 0.5]

  classifier_hidden_dim:
    values: [128, 256, 512]

  patience:
    value: 3

  batch_size:
    value: 128

  num_epochs:
    value: 30

command:
  - uv
  - run
  - ${program}
  - ${args}